[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tfbsm-pricing"
version = "0.1.0"
description = "Independent European time-fractional Black-Scholes solvers"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
